<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Aplikasi Absensi Otomatis Siswa dengan Selfie Wajib, Jam Server, Lokasi GPS, dan Notifikasi Telegram" />
  <title>e-Absensi Sekolah - Presensi Otomatis</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts (Google Fonts: Plus Jakarta Sans & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=1.3.0" />
  <link rel="stylesheet" href="css/components.css?v=1.3.0" />
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="brand-wrapper">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">e-Absensi Sekolah</div>
          <div class="brand-subtitle">SMAN 1 Teladan • Presensi Otomatis</div>
        </div>
      </div>

      <div class="header-actions" id="headerRoleControls">
        <!-- Injected dynamically by App.js -->
      </div>
    </header>

    <!-- Testing & Demo Simulator Toolbar -->
    <div class="test-toolbar" id="demoToolbar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-weight: 700; color: var(--primary-900);">Mode Pengujian:</span>
        <button id="btnToggleToolbar" class="btn btn-sm btn-outline" style="padding: 2px 8px; font-size: 0.72rem; min-height: 24px; border-radius: 4px;" onclick="const c = document.getElementById('testControlsGroup'); c.style.display = c.style.display === 'none' ? 'flex' : 'none'; this.textContent = c.style.display === 'none' ? 'Tampilkan Opsi' : 'Sembunyikan';">
          Sembunyikan
        </button>
      </div>
      <div class="test-controls" id="testControlsGroup">
        <label style="display: flex; align-items: center; gap: 4px;">
          <span>Lokasi GPS:</span>
          <select class="test-select" onchange="App.setMockGpsMode(this.value)">
            <option value="school">Di Sekolah (Dalam Radius)</option>
            <option value="outside">Di Luar Radius (1.5 km)</option>
            <option value="low_accuracy">Akurasi Rendah (&gt;50m)</option>
            <option value="real">GPS Perangkat Nyata</option>
          </select>
        </label>

        <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
          <input type="checkbox" onchange="App.toggleOfflineSimulation(this)" />
          <span>Simulasi Offline</span>
        </label>

        <button class="btn btn-sm btn-secondary" style="padding: 3px 10px; font-size: 0.78rem; min-height: 28px;" onclick="App.openTelegramSimulatorModal()">
          Simulator Bot Telegram
        </button>

        <button class="btn btn-sm btn-secondary" style="padding: 3px 10px; font-size: 0.78rem; min-height: 28px;" onclick="if(confirm('Reset semua data demo ke awal?')) { DB.reset(); OfflineService.clearQueue(); location.reload(); }">
          Reset Data
        </button>
      </div>
    </div>

    <!-- Main Content Mount Point -->
    <main id="appContent"></main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application JS Modules -->
  <script src="js/config.js?v=1.3.0"></script>
  <script src="js/supabase.js?v=1.3.0"></script>
  <script src="js/icons.js?v=1.3.0"></script>
  <script src="js/db.js?v=1.3.0"></script>
  <script src="js/geo.js?v=1.3.0"></script>
  <script src="js/camera.js?v=1.3.0"></script>
  <script src="js/offline.js?v=1.3.0"></script>
  <script src="js/telegram.js?v=1.3.0"></script>
  <script src="js/views/login.js?v=1.3.0"></script>
  <script src="js/views/consent.js?v=1.3.0"></script>
  <script src="js/views/student.js?v=1.3.0"></script>
  <script src="js/views/admin.js?v=1.3.0"></script>
  <script src="js/app.js?v=1.3.0"></script>
</body>
</html>
